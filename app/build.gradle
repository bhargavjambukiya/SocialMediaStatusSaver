apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
    // Normalize copy‑paste whitespaceP
    ["storePassword", "keyAlias", "keyPassword", "storeFile"].each { k ->
        def v = keystoreProperties[k]
        if (v instanceof String) {
            keystoreProperties[k] = v.trim()
        }
    }
}

def ksPath = keystoreProperties["storeFile"]?.toString()
def ksStorePwd = keystoreProperties["storePassword"]?.toString()
def ksKeyAlias = keystoreProperties["keyAlias"]?.toString()
def ksKeyPwd = keystoreProperties["keyPassword"]?.toString()
def ksFile = ksPath ? rootProject.file(ksPath) : null
/** When true (e.g. -PSCREENSHOT_BUILD=true), BuildConfig disables all monetization paths for Store screenshots */
def screenshotBuild = ((project.findProperty("SCREENSHOT_BUILD") ?: "false").toString().toBoolean())
def releaseSigningComplete = keystorePropertiesFile.exists()
        && ksPath && ksStorePwd && ksKeyAlias && ksKeyPwd
        && !ksPath.isEmpty() && !ksStorePwd.isEmpty() && !ksKeyAlias.isEmpty() && !ksKeyPwd.isEmpty()
        && ksFile != null && ksFile.exists()

android {
    namespace "com.studio.statusvault"
    compileSdk 36

    defaultConfig {
        applicationId "com.studio.statusvault"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 4
        versionName "1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Contact support: set in root gradle.properties, then Sync — see SUPPORT_RECIPIENT_EMAIL / SUPPORT_FORMSPREE_ID
        def supportInbox = (project.findProperty("SUPPORT_RECIPIENT_EMAIL") ?: "").toString()
        def formspreeId = (project.findProperty("SUPPORT_FORMSPREE_ID") ?: "").toString()
        resValue "string", "support_recipient_email", supportInbox
        resValue "string", "support_formspree_form_id", formspreeId
        buildConfigField "boolean", "SCREENSHOT_BUILD", screenshotBuild ? "true" : "false"
    }

    signingConfigs {
        release {
            if (releaseSigningComplete) {
                keyAlias ksKeyAlias
                keyPassword ksKeyPwd
                storePassword ksStorePwd
                storeFile ksFile
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningComplete) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation "com.intuit.sdp:sdp-android:1.0.6"
    implementation "com.intuit.ssp:ssp-android:1.0.6"
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'commons-io:commons-io:2.15.1'
    implementation 'com.github.chrisbanes:PhotoView:2.1.3'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.android.billingclient:billing:7.1.1'
    implementation 'com.github.a914-gowtham:android-video-trimmer:1.8.2'
}
